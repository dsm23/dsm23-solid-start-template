name: Unit Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  LEFTHOOK: 0

permissions: {}

jobs:
  unit-testing-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Git Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Node setup
        uses: ./.github/actions/setup

      - name: Unit & Integration tests
        run: >
          pnpm exec vitest run
          --project unit
          --reporter blob
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
          --coverage.enabled
          --coverage.reporter json
          --coverage.reporter json-summary
          --coverage.thresholds.branches 0
          --coverage.thresholds.functions 0
          --coverage.thresholds.lines 0
          --coverage.thresholds.statements 0

      - name: Upload blob report to GitHub Actions Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: .vitest-reports/*
          include-hidden-files: true
          retention-days: 1

  unit-testing:
    runs-on: ubuntu-latest
    needs:
      - unit-testing-shard
    permissions:
      pull-requests: write
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Git Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Node setup
        uses: ./.github/actions/setup

      - name: Download blob reports from GitHub Actions Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: .vitest-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        run: >
          pnpm exec vitest
          --coverage.enabled
          --coverage.reporter json
          --coverage.reporter json-summary
          --coverage.reporter text
          --merge-reports
        env:
          FORCE_COLOR: 1

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-prev
          path: coverage/coverage-summary.json

      - name: Download previous coverage report
        # renovate: datasource=github-releases depName=dawidd6/action-download-artifact
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        if: success() && github.event.number
        with:
          name: coverage-prev
          workflow: unit-testing.yml
          branch: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          path: ./coverage-prev

      - name: Coverage in GitHub PR comment
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
        with:
          file-coverage-mode: all
          json-summary-compare-path: |
            ${{ github.event_name == 'pull_request' && 'coverage-prev/coverage-summary.json' || null }}
